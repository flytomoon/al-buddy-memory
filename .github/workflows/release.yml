name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      # Trusted publishing: npm verifies this workflow's OIDC identity (configured once in
      # the package's settings on npmjs.com), signs the release with provenance, and no
      # token is stored anywhere. Needs npm >= 11.5.
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

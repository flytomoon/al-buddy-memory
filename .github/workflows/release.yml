name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      # Trusted publishing, staged: npm verifies this workflow's OIDC identity (configured
      # once in the package's settings on npmjs.com), the version is STAGED with provenance,
      # and it goes public only when a maintainer approves it with 2FA — on npmjs.com under
      # "Staged Packages", or `npm stage approve <stage-id>`. No token is stored anywhere and
      # no automated path can publish on its own. Needs npm >= 11.19.
      - run: npm install -g npm@latest
      - run: npm stage publish --provenance --access public
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            The npm version is **staged**, not yet public. To release it: npmjs.com → al-buddy-memory → Staged Packages → Approve (2FA), or `npm stage approve` from a logged-in terminal.
